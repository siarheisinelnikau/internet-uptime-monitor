name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = ((Get-Content Cargo.toml | Select-String '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value)
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match the Cargo package version.' }
      - run: cargo build --locked --release
      - name: Package single executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item target/release/internet-uptime-monitor.exe release/
          $hash = (Get-FileHash release/internet-uptime-monitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  internet-uptime-monitor.exe" | Set-Content release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-notes.md
          generate_release_notes: true
          files: |
            release/internet-uptime-monitor.exe
            release/SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
      - name: Mark superseded initial build
        if: github.ref_name == 'v0.1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0 --prerelease --latest=false --notes-file docs/v0.1.0-issue.md
