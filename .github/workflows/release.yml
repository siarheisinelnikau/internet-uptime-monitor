name: Windows release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/release-notes.md']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare release version
        id: version
        shell: pwsh
        run: |
          $version = ((Get-Content Cargo.toml | Select-String '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value)
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $subject = ($event.head_commit.message -split "`n")[0].TrimEnd("`r")
            if ($subject -cne "Release localization $tag") { throw 'An exact final release subject matching the Cargo version is required.' }
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Release tag must match the Cargo package version.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exe=InternetUptimeMonitor-$tag.exe" >> $env:GITHUB_OUTPUT
      - name: Refuse to replace a published release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              const {data: reference} = await github.rest.git.getRef({...context.repo, ref: `tags/${process.env.RELEASE_TAG}`});
              if (reference.object.type !== 'commit' || reference.object.sha !== context.sha) {
                throw new Error('An existing version tag belongs to another commit.');
              }
            } catch (error) { if (error.status !== 404) throw error; }
            try {
              const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG});
              if (!release.draft || release.target_commitish !== context.sha) core.setFailed('This release is published or belongs to another commit. Bump the version instead of replacing it.');
            } catch (error) { if (error.status !== 404) throw error; }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package single executable
        shell: pwsh
        env:
          RELEASE_EXE: ${{ steps.version.outputs.exe }}
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item target/release/internet-uptime-monitor.exe "release/$env:RELEASE_EXE"
          $hash = (Get-FileHash "release/$env:RELEASE_EXE" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:RELEASE_EXE" | Set-Content release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Internet Uptime Monitor ${{ steps.version.outputs.tag }}
          draft: true
          body_path: docs/release-notes.md
          files: |
            release/${{ steps.version.outputs.exe }}
            release/SHA256SUMS.txt
      - name: Publish complete release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({...context.repo, release_id: Number(process.env.RELEASE_ID), draft: false, make_latest: 'true'});
