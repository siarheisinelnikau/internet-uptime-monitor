[package]
name = "internet-uptime-monitor"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "A quiet, local internet outage monitor with clear evidence and reports"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tempfile = "3"
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }

[target.'cfg(windows)'.dependencies]
bytemuck = "1"
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[build-dependencies]
winresource = "0.1"

[features]
screenshots = ["dep:image"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
